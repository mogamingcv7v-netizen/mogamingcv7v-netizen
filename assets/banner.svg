<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mostafa — Full-Stack Developer">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#9EF0D8" opacity="0.07"/>
    </pattern>
    <linearGradient id="violetFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6C5CE7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="280" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="900" height="280" fill="#16191E"/>
    <rect width="900" height="280" fill="url(#grid)"/>
    <rect x="500" width="400" height="280" fill="url(#violetFade)"/>
    <rect x="0" y="0" width="6" height="280" fill="#9EF0D8"/>

    <!-- name block -->
    <rect x="57" y="86" width="34" height="4" rx="2" fill="#9EF0D8"/>
    <text x="54" y="150" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="66" font-weight="700" fill="#F2F5F7" letter-spacing="0.5">Mostafa</text>
    <text x="57" y="188" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="17" font-weight="500" fill="#9EF0D8" letter-spacing="5.5">FULL-STACK DEVELOPER</text>
    <text x="56" y="230" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="14" fill="#768390"><tspan fill="#9EF0D8" font-weight="700">7</tspan> SaaS shipped&#160;&#160;·&#160;&#160;<tspan fill="#9EF0D8" font-weight="700">2</tspan> years in&#160;&#160;·&#160;&#160;still learning</text>

    <!-- monogram card -->
    <g transform="translate(664,74)">
      <rect width="180" height="132" rx="16" fill="#1E232B" stroke="#2A3140"/>
      <text x="90" y="80" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="62" font-weight="700" fill="#9EF0D8" text-anchor="middle">M</text>
      <text x="90" y="112" font-family="'Courier New', monospace" font-size="12" letter-spacing="4" fill="#6E7A87" text-anchor="middle">EST. 2024</text>
    </g>

    <rect x="0.5" y="0.5" width="899" height="279" rx="19.5" stroke="#2A3140"/>
  </g>
</svg>
